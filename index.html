<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 낱말 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-2:#EFE7D4;
    --ink:#232A3B;
    --ink-soft:#5B5747;
    --line:#D9CFB6;
    --seal:#B3402F;
    --seal-2:#8F3222;
    --gold:#A8823A;
    --ok:#4B7A5B;
    --ok-bg:#E4EEDF;
    --bad:#B3402F;
    --bad-bg:#F5E2DD;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1D1B16;
      --paper-2:#26241D;
      --ink:#EFE7D4;
      --ink-soft:#B9B097;
      --line:#3A362B;
      --seal:#D97757;
      --seal-2:#C6603F;
      --gold:#C9A45C;
      --ok:#8FC49C;
      --ok-bg:#233327;
      --bad:#E08C77;
      --bad-bg:#3A2420;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1D1B16;
    --paper-2:#26241D;
    --ink:#EFE7D4;
    --ink-soft:#B9B097;
    --line:#3A362B;
    --seal:#D97757;
    --seal-2:#C6603F;
    --gold:#C9A45C;
    --ok:#8FC49C;
    --ok-bg:#233327;
    --bad:#E08C77;
    --bad-bg:#3A2420;
  }
  html,body{height:100%;}
  * { -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:520px;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
  }
  header.top .brand{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.02em;
  }
  header.top .brand small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.14em;
    margin-top:2px;
  }
  .seal{
    width:38px;height:38px;border-radius:6px;
    border:2px solid var(--seal);
    color:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    transform:rotate(-6deg);
    flex:none;
  }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
  }
  h1.page-title{
    font-family:'Noto Serif JP', serif;
    font-size:21px;
    font-weight:600;
    margin:0 0 6px;
    line-height:1.4;
  }
  p.sub{
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 20px;
  }
  .section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label:first-of-type{ margin-top:0; }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .cat-list{ display:flex; flex-direction:column; gap:8px; }
  .cat{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    user-select:none;
  }
  .cat.active{
    border-color:var(--seal);
    background:var(--ok-bg);
  }
  .cat .box{
    width:19px;height:19px;
    border-radius:5px;
    border:2px solid var(--ink-soft);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:var(--paper);
  }
  .cat.active .box{ background:var(--seal); border-color:var(--seal); }
  .cat .name{ font-weight:700; font-size:14.5px; }
  .cat .count{ margin-left:auto; font-size:12px; color:var(--ink-soft); }
  .mode-list{ display:flex; flex-direction:column; gap:8px; }
  .mode{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    user-select:none;
  }
  .mode.active{ border-color:var(--seal); background:var(--ok-bg); }
  .mode .box{
    width:19px;height:19px;
    border-radius:5px;
    border:2px solid var(--ink-soft);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:var(--paper);
  }
  .mode.active .box{ background:var(--seal); border-color:var(--seal); }
  .mode .mtext{ flex:1; }
  .mode .mname{ font-weight:700; font-size:14.5px; }
  .mode .mdesc{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .mode.disabled{ opacity:.45; pointer-events:none; }
  .qty-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .qty-btn{
    flex:1;
    min-width:64px;
    padding:11px 0;
    text-align:center;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
  }
  .qty-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .start-btn{
    margin-top:26px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:11px;
    background:var(--seal);
    color:#fff;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:16px;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .start-btn:active{ background:var(--seal-2); }
  .start-btn:disabled{ background:var(--line); color:var(--ink-soft); }
  .hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  /* quiz screen */
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .quiz-top .tag{
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
  }
  .progress-track{
    height:6px;
    background:var(--paper-2);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:26px;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    background:var(--seal);
    transition:width .25s ease;
  }
  .question-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:38px 18px;
    text-align:center;
    margin-bottom:22px;
  }
  .question-card .qcat{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:700;
    letter-spacing:.08em;
    margin-bottom:14px;
  }
  .question-card .qtext{
    font-family:'Noto Serif JP', serif;
    font-size:44px;
    font-weight:600;
    line-height:1.3;
    word-break:keep-all;
  }
  .question-card .qtext.small{ font-size:30px; }
  .question-card .qtext.meaning{ font-family:'Noto Sans KR', sans-serif; font-size:24px; font-weight:800; }
  .listen-btn{
    width:88px;height:88px;
    border-radius:50%;
    border:none;
    background:var(--seal);
    color:#fff;
    font-size:34px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;
    cursor:pointer;
  }
  .listen-btn:active{ background:var(--seal-2); }
  .listen-label{
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .reveal-text{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    font-family:'Noto Serif JP', serif;
    font-size:22px;
    font-weight:600;
  }
  .reveal-text .rk{ }
  .reveal-text .rm{
    display:block;
    margin-top:4px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .answers{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ans-btn{
    padding:15px 16px;
    text-align:left;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:11px;
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ans-btn .letter{
    width:24px;height:24px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    font-weight:700;
    flex:none;
    color:var(--ink-soft);
  }
  .ans-btn.correct{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .ans-btn.correct .letter{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .ans-btn.wrong{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .ans-btn.wrong .letter{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .ans-btn.disabled{ pointer-events:none; }
  .ans-btn.dim{ opacity:.45; }

  .next-btn{
    margin-top:18px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:11px;
    background:var(--ink);
    color:var(--paper);
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }

  /* result screen */
  .score-hero{
    text-align:center;
    padding:30px 10px 10px;
  }
  .score-hero .big{
    font-family:'Noto Serif JP', serif;
    font-size:56px;
    font-weight:700;
    color:var(--seal);
    line-height:1;
  }
  .score-hero .of{ color:var(--ink-soft); font-size:15px; margin-top:6px; }
  .score-hero .msg{ margin-top:12px; font-size:14px; color:var(--ink-soft); }
  .review-list{ margin-top:24px; display:flex; flex-direction:column; gap:8px; }
  .review-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:13.5px;
  }
  .review-item .rk{ font-family:'Noto Serif JP', serif; font-weight:600; font-size:17px; flex:none; min-width:64px;}
  .review-item .ra{ color:var(--bad); }
  .review-item .rc{ color:var(--ok); font-weight:700; }
  .review-item .arrow{ color:var(--ink-soft); }
  .retry-row{ display:flex; gap:10px; margin-top:24px; }
  .retry-row button{
    flex:1;
    padding:14px;
    border-radius:11px;
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .retry-row .primary{ background:var(--seal); color:#fff; border:none; }
  .retry-row .ghost{ background:var(--paper); color:var(--ink); }

  .hidden{ display:none !important; }
  ::selection{ background:var(--seal); color:#fff; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">日本語 小テスト<small>일본어 낱말 시험</small></div>
    <div class="seal">試</div>
  </header>

  <!-- SETUP SCREEN -->
  <section id="screen-setup">
    <h1 class="page-title">무엇을 시험 볼까요?</h1>
    <p class="sub">범위를 고르고 문제 수를 정한 뒤 시작하세요. 히라가나 발음 규칙과 단어를 함께 연습할 수 있어요.</p>

    <div class="section-label">글자 범위</div>
    <div class="cat-list" id="catList"></div>

    <div class="section-label">출제 방식</div>
    <div class="mode-list" id="modeList"></div>
    <div class="hint" id="modeHint"></div>

    <div class="section-label">문제 수</div>
    <div class="qty-row" id="qtyRow"></div>

    <button class="start-btn" id="startBtn" disabled>시험 시작</button>
    <div class="hint" id="poolHint"></div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="screen-quiz" class="hidden">
    <div class="quiz-top">
      <span id="quizIndex">1 / 10</span>
      <span class="tag" id="quizScore">맞음 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="question-card">
      <div class="qcat" id="qCat">기본 히라가나</div>
      <div class="qtext" id="qText">あ</div>
      <button class="listen-btn hidden" id="listenBtn">🔊</button>
      <div class="listen-label hidden" id="listenLabel">눌러서 다시 듣기</div>
      <div class="reveal-text hidden" id="revealText"></div>
    </div>

    <div class="answers" id="answers"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="screen-result" class="hidden">
    <div class="card">
      <div class="score-hero">
        <div class="big" id="resultScore">0 / 0</div>
        <div class="of" id="resultPercent">정답률 0%</div>
        <div class="msg" id="resultMsg"></div>
      </div>
      <div id="reviewWrap">
        <div class="section-label">틀린 문제 다시 보기</div>
        <div class="review-list" id="reviewList"></div>
      </div>
      <div class="retry-row">
        <button class="ghost" id="backBtn">범위 다시 고르기</button>
        <button class="primary" id="retryBtn">같은 범위 다시</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  // ---------- DATA ----------
  const basic = [
    ["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
    ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
    ["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],
    ["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],
    ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
    ["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],
    ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
    ["や","ya"],["ゆ","yu"],["よ","yo"],
    ["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
    ["わ","wa"],["を","wo"],["ん","n"]
  ];
  const dakuten = [
    ["が","ga"],["ぎ","gi"],["ぐ","gu"],["げ","ge"],["ご","go"],
    ["ざ","za"],["じ","ji"],["ず","zu"],["ぜ","ze"],["ぞ","zo"],
    ["だ","da"],["ぢ","ji"],["づ","zu"],["で","de"],["ど","do"],
    ["ば","ba"],["び","bi"],["ぶ","bu"],["べ","be"],["ぼ","bo"]
  ];
  const handakuten = [
    ["ぱ","pa"],["ぴ","pi"],["ぷ","pu"],["ぺ","pe"],["ぽ","po"]
  ];
  const youon = [
    ["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],
    ["しゃ","sha"],["しゅ","shu"],["しょ","sho"],
    ["ちゃ","cha"],["ちゅ","chu"],["ちょ","cho"],
    ["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],
    ["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],
    ["みゃ","mya"],["みゅ","myu"],["みょ","myo"],
    ["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],
    ["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],
    ["じゃ","ja"],["じゅ","ju"],["じょ","jo"],
    ["びゃ","bya"],["びゅ","byu"],["びょ","byo"],
    ["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"]
  ];

  const customWords = [
    ["あう","만나다"],["うえ","위"],["ここ","여기"],["いく","가다"],["かお","얼굴"],
    ["いえ","집"],["きく","듣다"],["あさ","아침"],["いす","의자"],["しち","칠, 7"],
    ["うた","노래"],["おかし","과자"],["つくえ","책상"],["ふね","배"],["あに","형, 오빠"],
    ["はな","꽃"],["ひと","사람"],["ねこ","고양이"],["きのう","어제"],["さいふ","지갑"],
    ["やま","산"],["ゆめ","꿈"],["なまえ","이름"],["きもの","기모노"],["やすみ","방학, 휴가"],
    ["さむい","춥다"],["かもく","과목"],["ゆかた","유카타"],["さくら","벚꽃"],["ほんや","서점"],
    ["まつり","마쓰리, 축제"],["わたし","나, 저"],["そば","메밀국수"],["いちご","딸기"],["おみくじ","오미쿠지"],
    ["じゆう","자유"],["じゅう","십, 10"],["びよういん","미용실"],["びょういん","병원"],["みっか","3일, 사흘"],
    ["はっせん","팔천, 8000"],["よっつ","넷, 4개"],["いっぱい","가득"],["さんぽ","산책"],["べんり","편리함"],
    ["まんが","만화"],["おかあさん","어머니"],["おじいさん","할아버지"],["おねえさん","누나, 언니"],["えいが","영화"],
    ["とおか","열흘, 10일"],["こうえん","공원"],["がっこう","학교"],["はっぴ","핫피"],["けっせき","결석"],
    ["よっか","나흘, 4일"],["いっしょ","함께함"],["なっとう","낫토"],["きっぷ","표"],["ちょっと","조금, 잠깐"],
    ["おばさん","아주머니"],["おばあさん","할머니"],["ゆうめい","유명함"]
  ];

  const sokuonKana = ["みっか","はっせん","よっつ","いっぱい","はっぴ","けっせき","よっか","いっしょ","なっとう","きっぷ","ちょっと","がっこう"];
  const hatsuonKana = ["ほんや","びよういん","びょういん","はっせん","さんぽ","べんり","まんが","おかあさん","おじいさん","おねえさん","こうえん","おばさん","おばあさん"];
  const chouonKana = ["きのう","びよういん","びょういん","とおか","こうえん","えいが","ゆうめい","じゆう","じゅう","おかあさん","おじいさん","おねえさん","おばあさん"];

  const wordMap = {};
  customWords.forEach(([k,m]) => wordMap[k] = m);
  function wordsFrom(list){ return list.map(k => [k, wordMap[k]]); }

  const CATEGORIES = [
    { id:"basic",      name:"기본 히라가나 (46자)", type:"kana", data: basic },
    { id:"dakuten",    name:"탁음 (が·ざ·だ·ば행)", type:"kana", data: dakuten },
    { id:"handakuten", name:"반탁음 (ぱ행)",        type:"kana", data: handakuten },
    { id:"youon",      name:"요음 (きゃ·しゃ 등)",   type:"kana", data: youon },
    { id:"sokuon",     name:"촉음 (っ 낱말)",        type:"word", data: wordsFrom(sokuonKana) },
    { id:"hatsuon",    name:"발음 (ん 낱말)",        type:"word", data: wordsFrom(hatsuonKana) },
    { id:"chouon",     name:"장음 (긴 소리 낱말)",   type:"word", data: wordsFrom(chouonKana) },
    { id:"custom",     name:"단어 시험 (60개)",      type:"word", data: customWords }
  ];

  // ---------- STATE ----------
  let selectedCats = new Set(["basic"]);
  let qty = 10;
  let selectedModes = new Set(["forward"]); // forward | reverse | listen (여러 개 선택 가능)
  let pool = [];         // {kana, answer, cat, type}
  let questions = [];
  let qIndex = 0;
  let correctCount = 0;
  let wrongList = [];
  let locked = false;
  let autoAdvanceTimer = null;

  const speechOk = ("speechSynthesis" in window);

  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }
  function warmUpAudio(){
    const ctx = getAudioCtx();
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
  }
  document.addEventListener("pointerdown", warmUpAudio, { once:true, passive:true });
  document.addEventListener("touchstart", warmUpAudio, { once:true, passive:true });
  document.addEventListener("keydown", warmUpAudio, { once:true });

  function scheduleTone(ctx, freq, start, duration, type){
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t0 = ctx.currentTime + start;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.03);
    }catch(e){}
  }
  function playTone(freq, start, duration, type){
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended"){
      ctx.resume().then(() => scheduleTone(ctx, freq, start, duration, type)).catch(() => {});
    } else {
      scheduleTone(ctx, freq, start, duration, type);
    }
  }
  function playCorrectSound(){
    playTone(880, 0, 0.11, "sine");
    playTone(1320, 0.1, 0.18, "sine");
  }
  function playWrongSound(){
    playTone(196, 0, 0.22, "sawtooth");
    playTone(147, 0.12, 0.26, "sawtooth");
  }

  let japaneseVoice = null;
  function loadVoices(){
    if (!speechOk) return;
    const voices = window.speechSynthesis.getVoices() || [];
    japaneseVoice =
      voices.find(v => v.lang && v.lang.toLowerCase() === "ja-jp") ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ja")) ||
      null;
  }
  if (speechOk){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text, type){
    if (!speechOk) return false;
    try{
      window.speechSynthesis.cancel();
      const isShort = text.length <= 2; // あ, きゃ 같은 짧은 글자
      const once = isShort ? text + "、" : text + "。";
      const spoken = type === "word" ? once : once + once; // 단어는 한 번, 글자는 두 번
      const doSpeak = () => {
        const u = new SpeechSynthesisUtterance(spoken);
        u.lang = "ja-JP";
        u.rate = isShort ? 0.55 : 0.6;
        u.pitch = 1;
        u.volume = 1;
        if (japaneseVoice) u.voice = japaneseVoice;
        window.speechSynthesis.speak(u);
        // 크롬 계열 브라우저는 speak() 직후 오디오 파이프라인이 늦게 열려
        // 발음의 앞/뒤가 잘리는 버그가 있다. pause -> resume을 강제로 호출하면
        // 파이프라인이 즉시 열려서 끝까지 재생된다.
        try{
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }catch(e){}
      };
      // cancel() 직후 바로 speak()를 부르면 브라우저에 따라 재생이 끝까지 안 되고
      // 잘리는 경우가 있어 짧은 지연을 둔다.
      setTimeout(doSpeak, 60);
      return true;
    }catch(e){ return false; }
  }

  const MODES = [
    { id:"forward", name:"문자 보고 뜻/발음 맞추기", desc:"ひらがな나 단어를 보고 로마자·뜻을 고릅니다." },
    { id:"reverse", name:"뜻/발음 보고 문자 맞추기", desc:"로마자나 뜻을 보고 알맞은 ひらがな·단어를 고릅니다." },
    { id:"listen",  name:"소리 듣고 문자 맞추기", desc:"단어는 발음을 듣고, 히라가나·탁음처럼 낱글자인 경우는 발음기호를 보고 알맞은 것을 고릅니다." + (speechOk ? "" : " (이 기기는 음성 재생을 지원하지 않아요)") }
  ];

  // ---------- SETUP SCREEN ----------
  const catListEl = document.getElementById("catList");
  const qtyRowEl = document.getElementById("qtyRow");
  const startBtn = document.getElementById("startBtn");
  const poolHint = document.getElementById("poolHint");

  CATEGORIES.forEach(cat => {
    const div = document.createElement("div");
    div.className = "cat" + (selectedCats.has(cat.id) ? " active" : "");
    div.dataset.id = cat.id;
    div.innerHTML = `<div class="box">✓</div><div class="name">${cat.name}</div><div class="count">${cat.data.length}개</div>`;
    div.addEventListener("click", () => {
      if (selectedCats.has(cat.id)) selectedCats.delete(cat.id);
      else selectedCats.add(cat.id);
      div.classList.toggle("active");
      refreshPoolHint();
    });
    catListEl.appendChild(div);
  });

  const modeListEl = document.getElementById("modeList");
  const modeHint = document.getElementById("modeHint");
  MODES.forEach(mode => {
    const div = document.createElement("div");
    const disabled = mode.id === "listen" && !speechOk;
    div.className = "mode" + (selectedModes.has(mode.id) ? " active" : "") + (disabled ? " disabled" : "");
    div.innerHTML = `<div class="box">✓</div><div class="mtext"><div class="mname">${mode.name}</div><div class="mdesc">${mode.desc}</div></div>`;
    div.addEventListener("click", () => {
      if (disabled) return;
      if (selectedModes.has(mode.id)) selectedModes.delete(mode.id);
      else selectedModes.add(mode.id);
      div.classList.toggle("active");
      refreshPoolHint();
    });
    modeListEl.appendChild(div);
  });
  modeHint.textContent = speechOk
    ? "여러 개 고르면 문제마다 방식이 섞여서 나와요."
    : "여러 개 고르면 문제마다 방식이 섞여서 나와요. 듣기 모드는 음성 합성을 지원하는 기기·브라우저에서만 사용할 수 있어요.";

  [10,30,50,0].forEach(n => {
    const b = document.createElement("div");
    b.className = "qty-btn" + (n === qty ? " active" : "");
    b.textContent = n === 0 ? "전체" : n + "문제";
    b.dataset.n = n;
    b.addEventListener("click", () => {
      qty = n;
      [...qtyRowEl.children].forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      refreshPoolHint();
    });
    qtyRowEl.appendChild(b);
  });
  qtyRowEl.children[0].classList.add("active");

  function currentPool(){
    let items = [];
    CATEGORIES.forEach(cat => {
      if (selectedCats.has(cat.id)){
        cat.data.forEach(([kana, answer]) => {
          items.push({ kana, answer, catName: cat.name, type: cat.type });
        });
      }
    });
    return items;
  }

  function refreshPoolHint(){
    const items = currentPool();
    const noMode = selectedModes.size === 0;
    startBtn.disabled = items.length < 4 || noMode;
    if (items.length === 0){
      poolHint.textContent = "먼저 범위를 하나 이상 골라주세요.";
    } else if (items.length < 4){
      poolHint.textContent = "문제를 만들려면 선택한 범위에 낱말이 4개 이상 있어야 해요.";
    } else if (noMode){
      poolHint.textContent = "출제 방식을 하나 이상 골라주세요.";
    } else {
      poolHint.textContent = `선택한 범위: 총 ${items.length}개 중에서 출제됩니다.`;
    }
  }
  refreshPoolHint();

  function assignDirections(qs){
    const modes = [...selectedModes];
    return qs.map(q => ({ ...q, direction: modes[Math.floor(Math.random() * modes.length)] }));
  }

  startBtn.addEventListener("click", () => {
    pool = currentPool();
    if (pool.length < 4 || selectedModes.size === 0) return;
    if (autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    const n = qty === 0 ? pool.length : Math.min(qty, pool.length);
    questions = assignDirections(shuffle(pool).slice(0, n));
    qIndex = 0;
    correctCount = 0;
    wrongList = [];
    showScreen("quiz");
    renderQuestion();
  });

  // ---------- QUIZ SCREEN ----------
  const quizIndexEl = document.getElementById("quizIndex");
  const quizScoreEl = document.getElementById("quizScore");
  const progressFillEl = document.getElementById("progressFill");
  const qCatEl = document.getElementById("qCat");
  const qTextEl = document.getElementById("qText");
  const answersEl = document.getElementById("answers");
  const listenBtn = document.getElementById("listenBtn");
  const listenLabel = document.getElementById("listenLabel");
  const revealText = document.getElementById("revealText");
  const LETTERS = ["A","B","C","D"];

  listenBtn.addEventListener("click", () => {
    const q = questions[qIndex];
    if (q) speak(q.kana, q.type);
  });

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // forward: 문자를 보고 뜻/로마자를 고름 -> 선택지는 answer 값
  // reverse/listen: 뜻·로마자 또는 소리를 보고/듣고 문자를 고름 -> 선택지는 kana 값
  function choiceField(dir){ return dir === "forward" ? "answer" : "kana"; }

  function buildChoices(question){
    const field = choiceField(question.direction);
    const correctVal = question[field];
    const sameType = pool.filter(p => p.type === question.type && p[field] !== correctVal);
    const seen = new Set();
    const distractors = [];
    shuffle(sameType).forEach(p => {
      if (distractors.length >= 3) return;
      if (seen.has(p[field])) return;
      seen.add(p[field]);
      distractors.push(p[field]);
    });
    while (distractors.length < 3){
      const fallback = pool.filter(p => p[field] !== correctVal && !distractors.includes(p[field]));
      if (fallback.length === 0) break;
      distractors.push(shuffle(fallback)[0][field]);
    }
    return shuffle([correctVal, ...distractors]);
  }

  function renderQuestion(){
    locked = false;
    const q = questions[qIndex];
    quizIndexEl.textContent = `${qIndex + 1} / ${questions.length}`;
    quizScoreEl.textContent = `맞음 ${correctCount}`;
    progressFillEl.style.width = `${(qIndex / questions.length) * 100}%`;
    qCatEl.textContent = q.catName;

    qTextEl.classList.remove("small","meaning","hidden");
    listenBtn.classList.add("hidden");
    listenLabel.classList.add("hidden");
    revealText.classList.add("hidden");
    revealText.innerHTML = "";

    const showAsPhonetic = q.direction === "reverse" || (q.direction === "listen" && q.type !== "word");
    const playAudio = q.direction === "listen" && q.type === "word";

    if (q.direction === "forward"){
      qTextEl.textContent = q.kana;
      qTextEl.classList.toggle("small", q.kana.length >= 5);
    } else if (showAsPhonetic){
      qTextEl.textContent = q.answer;
      qTextEl.classList.add("meaning");
    } else if (playAudio){
      qTextEl.classList.add("hidden");
      listenBtn.classList.remove("hidden");
      listenLabel.classList.remove("hidden");
      setTimeout(() => speak(q.kana, q.type), 250);
    }

    const choices = buildChoices(q);
    answersEl.innerHTML = "";
    choices.forEach((choice, i) => {
      const btn = document.createElement("button");
      btn.className = "ans-btn";
      btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${choice}</span>`;
      btn.addEventListener("click", () => selectAnswer(btn, choice, q));
      answersEl.appendChild(btn);
    });
  }

  function selectAnswer(btn, choice, q){
    if (locked) return;
    locked = true;
    const field = choiceField(q.direction);
    const correctVal = q[field];
    const isCorrect = choice === correctVal;
    const showAsPhonetic = q.direction === "reverse" || (q.direction === "listen" && q.type !== "word");
    const isWordListen = q.direction === "listen" && q.type === "word";

    if (isCorrect){
      correctCount++;
      playCorrectSound();
    } else {
      wrongList.push({ prompt: showAsPhonetic ? q.answer : q.kana, answer: correctVal, picked: choice, audio: isWordListen });
      playWrongSound();
    }

    if (isWordListen){
      revealText.innerHTML = `<span class="rk">${q.kana}</span><span class="rm">${q.answer}</span>`;
      revealText.classList.remove("hidden");
    }

    [...answersEl.children].forEach(b => {
      b.classList.add("disabled");
      const label = b.querySelector("span:last-child").textContent;
      if (label === correctVal) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    quizScoreEl.textContent = `맞음 ${correctCount}`;

    const delay = q.direction === "listen" ? 1000 : 500;
    autoAdvanceTimer = setTimeout(goNext, delay);
  }

  function goNext(){
    if (autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    qIndex++;
    if (qIndex >= questions.length){
      progressFillEl.style.width = "100%";
      showResult();
    } else {
      renderQuestion();
    }
  }

  // ---------- RESULT SCREEN ----------
  const resultScoreEl = document.getElementById("resultScore");
  const resultPercentEl = document.getElementById("resultPercent");
  const resultMsgEl = document.getElementById("resultMsg");
  const reviewListEl = document.getElementById("reviewList");
  const reviewWrapEl = document.getElementById("reviewWrap");
  const backBtn = document.getElementById("backBtn");
  const retryBtn = document.getElementById("retryBtn");

  function showResult(){
    const total = questions.length;
    const pct = Math.round((correctCount / total) * 100);
    resultScoreEl.textContent = `${correctCount} / ${total}`;
    resultPercentEl.textContent = `정답률 ${pct}%`;
    resultMsgEl.textContent =
      pct === 100 ? "완벽해요! 만점입니다." :
      pct >= 80 ? "아주 잘했어요, 거의 다 맞혔네요." :
      pct >= 50 ? "절반 이상 맞혔어요. 틀린 것만 다시 보면 금방 늘어요." :
      "천천히 다시 훑어보면서 익혀봐요.";

    if (wrongList.length === 0){
      reviewWrapEl.classList.add("hidden");
    } else {
      reviewWrapEl.classList.remove("hidden");
      reviewListEl.innerHTML = "";
      wrongList.forEach(w => {
        const div = document.createElement("div");
        div.className = "review-item";
        div.innerHTML = `<span class="rk">${w.audio ? "🔊" : w.prompt}</span><span class="ra">${w.picked}</span><span class="arrow">→</span><span class="rc">${w.answer}</span>`;
        reviewListEl.appendChild(div);
      });
    }
    showScreen("result");
  }

  backBtn.addEventListener("click", () => showScreen("setup"));
  retryBtn.addEventListener("click", () => {
    if (autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    const n = qty === 0 ? pool.length : Math.min(qty, pool.length);
    questions = assignDirections(shuffle(pool).slice(0, n));
    qIndex = 0;
    correctCount = 0;
    wrongList = [];
    showScreen("quiz");
    renderQuestion();
  });

  // ---------- SCREEN SWITCH ----------
  function showScreen(name){
    ["setup","quiz","result"].forEach(s => {
      document.getElementById("screen-" + s).classList.toggle("hidden", s !== name);
    });
  }
})();
</script>
</body>
</html>
